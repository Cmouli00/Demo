services:
  mongodb:
    image: mongo:8
    container_name: shared-platform-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend

    container_name: shared-platform-backend

    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      APP_ENV: development
      PORT: 8000
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: blog
      # JWT_SECRET: ${JWT_SECRET}
      APP_ONE_ORIGIN: http://localhost:3000
      APP_TWO_ORIGIN: http://localhost:3001

    depends_on:
      - mongodb

volumes:
  mongodb_data: